<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.01" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>

    <style>
      .glow-orb {
        animation: pulseOrb 6s ease-in-out infinite alternate;
      }
      .flow-pulse1 {
        animation: flowDash 3s linear infinite;
      }
      .flow-pulse2 {
        animation: flowDash 4s linear infinite;
      }
      .badge-glow {
        animation: badgePulse 3s ease-in-out infinite alternate;
      }
      .test-pulse {
        animation: testRun 2.5s ease-in-out infinite;
      }
      @keyframes pulseOrb {
        0% { transform: scale(0.9); opacity: 0.25; }
        100% { transform: scale(1.15); opacity: 0.55; }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes badgePulse {
        0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
        100% { filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.7)); }
      }
      @keyframes testRun {
        0%, 100% { fill: #22c55e; }
        50% { fill: #38bdf8; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#dotPattern)" />

  <!-- Dynamic Glowing Background Orbs -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="140" fill="#38bdf8" class="glow-orb" filter="url(#glow)" />
  </g>
  <g transform="translate(1050, 300)">
    <circle cx="0" cy="0" r="160" fill="#a855f7" class="glow-orb" filter="url(#glow)" style="animation-delay: -3s;" />
  </g>
  <g transform="translate(600, 390)">
    <circle cx="0" cy="0" r="120" fill="#6366f1" class="glow-orb" filter="url(#glow)" style="animation-delay: -1.5s;" />
  </g>

  <!-- Ambient Dynamic Circuit / Execution Flow Lines (Background) -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 50 80 H 300 L 350 130 H 850 L 900 80 H 1150" />
    <path d="M 100 370 H 400 L 450 320 H 750 L 800 370 H 1100" />
    <path d="M 50 80 H 300 L 350 130 H 850 L 900 80 H 1150" stroke="#818cf8" stroke-width="2" stroke-dasharray="15 35" class="flow-pulse1" />
    <path d="M 100 370 H 400 L 450 320 H 750 L 800 370 H 1100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="20 40" class="flow-pulse2" />
  </g>

  <!-- Animated Interactive Pills (Behind Text, Bottom & Top Anchors) -->
  <g transform="translate(0, 0)">
    <!-- Top Status Banner -->
    <g transform="translate(430, 32)">
      <rect x="0" y="0" width="340" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" class="badge-glow" />
      <circle cx="20" cy="17" r="5" class="test-pulse" />
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
        AUTOMATED PIPELINE &amp; CLOUD GRIDS ACTIVE
      </text>
    </g>

    <!-- Foreground Content (Always Front & Clear) -->
    <!-- Category Badge -->
    <g transform="translate(415, 95)">
      <rect x="0" y="0" width="370" height="30" rx="15" fill="#0f172a" fill-opacity="0.9" stroke="#6366f1" stroke-width="1" />
      <text x="185" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">
        ✦ AWESOME QA &amp; TEST AUTOMATION ✦
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.5))">
      End-to-End Testing &amp; QA Automation
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="220" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="url(#subGrad)" letter-spacing="0.2">
      Curated Cloud Browser Grids, Mobile Farms, AI Self-Healing Agents &amp; OSS Frameworks
    </text>

    <!-- Dynamic Tech Pills / Tags (Bottom Anchor, Never Overlaps Title) -->
    <g transform="translate(125, 275)">
      <!-- Pill 1: Playwright -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#22c55e" stroke-width="1.2" />
        <circle cx="18" cy="19" r="4" fill="#22c55e" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Playwright</text>
      </g>

      <!-- Pill 2: Cypress -->
      <g transform="translate(155, 0)">
        <rect x="0" y="0" width="125" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
        <circle cx="18" cy="19" r="4" fill="#38bdf8" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Cypress</text>
      </g>

      <!-- Pill 3: Selenium Grid -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="145" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#eab308" stroke-width="1.2" />
        <circle cx="18" cy="19" r="4" fill="#eab308" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Selenium Grid</text>
      </g>

      <!-- Pill 4: Appium / Mobile -->
      <g transform="translate(465, 0)">
        <rect x="0" y="0" width="140" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2" />
        <circle cx="18" cy="19" r="4" fill="#a855f7" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Appium &amp; iOS</text>
      </g>

      <!-- Pill 5: Visual AI Regression -->
      <g transform="translate(625, 0)">
        <rect x="0" y="0" width="165" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#ec4899" stroke-width="1.2" />
        <circle cx="18" cy="19" r="4" fill="#ec4899" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Visual AI &amp; Diffing</text>
      </g>

      <!-- Pill 6: Autonomous Agents -->
      <g transform="translate(810, 0)">
        <rect x="0" y="0" width="140" height="38" rx="19" fill="#1e293b" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2" />
        <circle cx="18" cy="19" r="4" fill="#06b6d4" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">AI Test Agents</text>
      </g>
    </g>

    <!-- Metrics Line -->
    <g transform="translate(250, 350)">
      <text x="350" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1">
        PARALLEL EXECUTION • CROSS-BROWSER • HEALING LOCATORS • CI/CD SHARDING • KUBERNETES GRIDS
      </text>
    </g>
  </g>
</svg>
